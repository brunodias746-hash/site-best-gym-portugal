<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Site temporariamente indisponível</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0e0f11; color: #fff; text-align: center; }
    main { max-width: 520px; }
    span { display: inline-block; width: 48px; height: 4px; margin-bottom: 24px; background: #e11507; }
    h1 { margin: 0 0 14px; font-size: clamp(32px, 8vw, 58px); line-height: .96; text-transform: uppercase; }
    p { margin: 0; color: #aeb1b7; font-size: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span aria-hidden="true"></span>
    <h1>Site temporariamente indisponível</h1>
    <p>Voltaremos em breve.</p>
  </main>
</body>
</html>
